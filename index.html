<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <title>Ireland Ev Map</title>
    <style>
        html, body{
            width: 100dvw;
            height: 100dvh;
            margin: 0;



        }

        #map{
            width: 100dvw;
            height: 100dvh;
            margin: 0;


        }





    </style>
</head>
<body>
      <div id="map"></div>
    <script>

        let init_zoom_level
        if (L.Browser.mobile){
            init_zoom_level = 6


        }else{

            init_zoom_level = 7
        }
        var map = L.map('map').setView([53.5000, -8.0000], init_zoom_level);  
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">Sourced From OSM</a>',
            noWrap : true,
            minZoom : init_zoom_level
  

        }).addTo(map);




        
        let southWest = L.latLng(51.155921,-11.072084)
        let northEast = L.latLng(55.452695,-5.851246)
        let bounds = L.latLngBounds(southWest,northEast)
        map.setMaxBounds(bounds)
        var marker_group = L.featureGroup().addTo(map)
        

async function GetGeoData(url) {
    try {
        const response = await fetch(url);
        if (!response.ok){
            alert(`There was an error once fetching data, Status: ${response.status}`)
            throw new Error(`HTTP error!, Status: ${response.status} `)

        }

        let unparsed = await response.text();
        let data = await JSON.parse(unparsed);
        marker_group.clearLayers()
        for (let x of data.stations){
            L.circleMarker([x[1],x[0]],{radius: 5,
                fillColor: '#1864d6',
                color: '#ffffff',
                weight: 2.5,
                fillOpacity: 0.8
        }).addTo(marker_group);} 
    }

    catch (error){
        console.error('Failed to get data: ',error.message);

    }

}  

    

        



        

        map.on('moveend',function(){
            let southwest = Object.values(map.getBounds().getSouthWest())
            let northeast = Object.values(map.getBounds().getNorthEast())
            GetGeoData(`https://evchargingpycode.onrender.com/charging_stations?xmin=${southwest[1]}&ymin=${southwest[0]}&xmax=${northeast[1]}&ymax=${northeast[0]}`)

        });
        

    </script>

</body>
