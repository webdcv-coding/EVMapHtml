<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <title>Test Page</title>
</head>
<body>
      <div id="map" style="height: 100vh;"></div>
    <script>
        
        var map = L.map('map',{preferCanvas:true}).setView([53.5000, -8.0000], 16);  

        
        let southWest = L.latLng(51.4310, -9.7880)
        let northEast = L.latLng(55.1957, -6.0617)
        let bounds = L.latLngBounds(southWest,northEast)
        map.setMaxBounds(bounds)
        map.fitBounds(bounds)
        var marker_group = L.featureGroup().addTo(map)

        async function GetGeoData(url) {
            const response = await fetch(url);
            let unparsed = await response.text();
            let data = await JSON.parse(unparsed);
            for (let x of data.stations){
                L.circleMarker([x[1],x[0]],{radius: 5,fillColor: '#1864d6',color: '#ffffff', weight: 1.5,fillOpacity: 0.9
            }).addTo(marker_group);
 

        };
        };



        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">Sourced From OSM</a>',
            noWrap : true,
            minZoom : 7
  

        }).addTo(map);

        //L.marker([52.8895, -8.9960]).addTo(map);
        map.on('moveend',function(){
            marker_group.clearLayers()
            let southwest = Object.values(map.getBounds().getSouthWest())
            let northeast = Object.values(map.getBounds().getNorthEast())
            GetGeoData(`https://evchargingpycode.onrender.com/charging_stations?xmin=${southwest[1]}&ymin=${southwest[0]}&xmax=${northeast[1]}&ymax=${northeast[0]}`)

        });
        

    </script>

</body>
</html>
